<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Minimalist quiet-luxury power-orbit mark with ~12% safe padding, legible on both Light & Dark themes -->
  <rect x="14" y="14" width="100" height="100" rx="26" fill="#181A1F" stroke="#343844" stroke-width="2.5"/>
  <!-- Outer calm orbital arc (power symbol inspired) -->
  <path
    d="M 45.5 39.2 A 30 30 0 1 0 82.5 39.2"
    stroke="#ECEEF2"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <!-- Vertical power stem -->
  <line
    x1="64"
    y1="30"
    x2="64"
    y2="58"
    stroke="#ECEEF2"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <!-- Subtle sage status dot -->
  <circle cx="64" cy="76" r="4.5" fill="#7EC8A0"/>
</svg>
